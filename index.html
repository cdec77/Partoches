    <link rel="apple-touch-icon" href="icon-180.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Outfit:wght@200;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --neon-lime: #ccff00; 
            --neon-blue: #00f0ff;
            --neon-pink: #ff00ff;
            --neon-orange: #ff6600;
            --neon-purple: #b026ff;
            --neon-cyan-soft: #7CFFEA;
            --bg: #020204; 
            --surface: #0a0a0e;
            --surface-accent: #111118;
            --page-bright: 1; 
            --page-contrast: 1; 
            /* Hauteur réelle du viewport, recalculée en JS (setAppVH) pour
               contourner les barres d'adresse dynamiques de Safari iOS / Chrome
               Android qui faussent 100vh lors du scroll ou de la rotation. */
            --app-vh: 1vh;
            /* Zones sûres (encoche, home indicator iPad/iPhone, barres nav Android) */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        
        * { -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg);
            background-image:
                radial-gradient(circle at 15% 8%, rgba(204,255,0,0.05), transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(0,240,255,0.045), transparent 45%);
            color: #e2e2e9; 
            font-family: 'Space Grotesk', sans-serif; 
            overflow: hidden; 
            margin: 0; 
            padding: 0;
            touch-action: none; 
            font-size: 13px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: none;
            /* Utilise la variable recalculée plutôt que 100vh brut : évite le
               "saut" de mise en page sur iPad/iPhone quand la barre Safari
               apparaît/disparaît pendant le défilement. */
            height: calc(var(--app-vh, 1vh) * 100);
            overscroll-behavior: none;
        }

        /* Cible tactile minimale confortable (recommandation Apple HIG ~44px)
           appliquée automatiquement sur tout device à pointeur "grossier"
           (doigt) : tablette et mobile, iPad Air 13" inclus. */
        @media (pointer: coarse) {
            .btn-jazz, .nav-rect, .tab-btn, .lang-switch { min-height: 40px; }
            .color-dot, .size-btn { min-width: 34px; min-height: 34px; }
        }

        .jazz-title { 
            font-family: 'Outfit', sans-serif; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--neon-lime), var(--neon-blue));
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 0 10px rgba(204, 255, 0, 0.25));
        }

        .glass { 
            background: rgba(2, 2, 4, 0.96); 
            backdrop-filter: blur(25px); 
            border-bottom: 1px solid rgba(204, 255, 0, 0.15); 
        }

        .file-row { 
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer; 
        }
        .file-row:hover { 
            border-color: var(--neon-lime);
            transform: translateX(4px);
            background: rgba(204, 255, 0, 0.04);
        }

        .btn-add-success {
            background: var(--neon-lime) !important;
            color: #000 !important;
            box-shadow: 0 0 20px var(--neon-lime) !important;
            border-color: var(--neon-lime) !important;
        }

        #view-layout { display: flex; height: calc(var(--app-vh, 1vh) * 100); width: 100vw; overflow: hidden; position: relative; }
        
        #viewer-sidebar {
            width: 280px; background: #020204; border-right: 1px solid rgba(204, 255, 0, 0.12);
            display: flex; flex-direction: column; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 450; position: relative;
            /* Sur iPad en mode paysage avec encoche/coins arrondis, on respecte
               la zone sûre gauche pour ne jamais faire chevaucher le contenu. */
            padding-left: var(--safe-left);
            padding-top: var(--safe-top);
        }
        #viewer-sidebar.collapsed { margin-left: -280px; }

        /* Sur tablette large (iPad Air 13" et assimilés), la colonne "Live
           Tracklist" gagne un peu en largeur pour rester lisible de loin
           (pupitre, distance de lecture supérieure à un téléphone). */
        @media (min-width: 1180px) {
            #viewer-sidebar { width: 320px; }
            #viewer-sidebar.collapsed { margin-left: -320px; }
        }

        /* SCROLL CONTAINER HYBRIDE OPTIMISÉ MOBILES ET TACTILE */
        #scroll-container {
            flex-grow: 1; height: calc(var(--app-vh, 1vh) * 100); overflow: auto; 
            background: #000; scroll-behavior: auto; 
            position: relative; display: block;
            -webkit-overflow-scrolling: touch;
            /* overscroll-behavior-y contain : empêche le "rubber-band" de la
               page entière iOS de se déclencher pendant un scroll de partition,
               ce qui perturbait visuellement l'auto-scroll en haut/bas de page. */
            overscroll-behavior-y: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(204,255,0,0.35) transparent;
        }
        #scroll-container::-webkit-scrollbar { width: 6px; }
        #scroll-container::-webkit-scrollbar-thumb { background: rgba(204,255,0,0.35); border-radius: 6px; }
        
        #viewer-content { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 120px 30px 450px 30px; 
            width: max-content; min-width: 100%; height: fit-content; 
            gap: 40px; margin: 0 auto;
        }
        
        .page-wrapper { 
            position: relative; flex-shrink: 0; background: white; 
            box-shadow: 0 0 45px rgba(0,0,0,0.9);
            filter: brightness(var(--page-bright)) contrast(var(--page-contrast));
            border-radius: 4px; transition: filter 0.2s ease;
            /* Le zoom est géré via transform sur chaque wrapper,
               MAIS on applique aussi une compensation de marge pour éviter
               tout chevauchement lorsqu'il y a plusieurs pages (PDF multi-pages).
               transform-origin: top center garantit que la page scale vers le bas
               et non vers le haut, ce qui évite le recouvrement du header. */
            transform-origin: top center;
            /* La valeur de margin-bottom est injectée dynamiquement par applyPageScales()
               pour compenser l'espace "volé" par le scale transform */
            max-width: 96vw;
        }

        /* Conteneur de rotation : enveloppe chaque page-wrapper pour
           appliquer la rotation INDÉPENDAMMENT du zoom, sans interférence */
        .rotation-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* La largeur/hauteur sera ajustée dynamiquement selon l'angle de rotation */
            transition: width 0.25s ease, height 0.25s ease;
            flex-shrink: 0;
        }

        /* AUTO-ADAPTATION DES INFRASTRUCTURES DE PAGES SUR ECRANS MOBILES */
        canvas, img { height: 80vh !important; width: auto !important; object-fit: contain; display: block; max-width: 100%; }
        
        .anno-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 10; 
        }
        
        .anno-active .anno-canvas { 
            pointer-events: auto; 
        }

        .tab-btn { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #555562; transition: 0.3s; text-transform: uppercase; }
        .tab-active { color: var(--neon-lime); text-shadow: 0 0 12px rgba(204, 255, 0, 0.6); }
        
        .btn-jazz { 
            background: rgba(204, 255, 0, 0.04);
            border: 1px solid var(--neon-lime); 
            color: var(--neon-lime); 
            font-size: 10px; 
            font-weight: 700; 
            padding: 7px 14px; 
            border-radius: 5px; 
            text-transform: uppercase;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-jazz:hover { background: var(--neon-lime); color: black; box-shadow: 0 0 15px rgba(204, 255, 0, 0.3); }
        
        .nav-rect {
            pointer-events: auto; background: rgba(10, 10, 14, 0.94); border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); font-weight: 700; font-size: 11px; padding: 12px 24px; border-radius: 6px;
            text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 20px rgba(0,240,255,0.15);
        }

        /* DOCK GENERAL CONTENANT LES OUTILS - S'ADAPTE AUTOMATIQUEMENT MOBILE VS PC */
        .right-control-dock {
            position: fixed; z-index: 500; pointer-events: none;
            display: flex; gap: 15px;
        }

        #anno-toolbar, #fx-toolbar, #scroll-toolbar {
            pointer-events: auto; display: none; padding: 14px; border-radius: 10px;
            background: rgba(6, 6, 10, 0.96); box-shadow: 0 0 35px rgba(0,0,0,0.85);
        }

        /* Bouton play/pause de l'auto-scroll : anneau lumineux qui pulse
           doucement lorsque le défilement automatique est actif, pour un
           retour visuel discret sans gêner la lecture de la partition. */
        #autoscroll-play {
            width: 46px; height: 46px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--neon-purple); color: var(--neon-purple);
            font-size: 16px; background: rgba(176, 38, 255, 0.08); cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1); flex-shrink: 0;
        }
        #autoscroll-play.on {
            background: var(--neon-purple); color: #fff;
            box-shadow: 0 0 8px var(--neon-purple), 0 0 22px rgba(176,38,255,0.55);
            animation: autoscroll-pulse 1.6s ease-in-out infinite;
        }
        @keyframes autoscroll-pulse {
            0%, 100% { box-shadow: 0 0 8px var(--neon-purple), 0 0 16px rgba(176,38,255,0.45); }
            50%      { box-shadow: 0 0 14px var(--neon-purple), 0 0 30px rgba(176,38,255,0.75); }
        }
        .autoscroll-label { font-size: 9px; color: #8b8b9a; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .chain-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .chain-toggle input { accent-color: var(--neon-purple); width: 15px; height: 15px; }
        
        /* STYLE PAR DEFAUT POUR LES ECRANS LARGES ET MODE PAYSAGE */
        @media (min-width: 769px) or (orientation: landscape) {
            .right-control-dock {
                right: 20px; top: 90px; flex-direction: column; bottom: auto; left: auto; width: auto;
                right: calc(20px + var(--safe-right));
            }
            #anno-toolbar { flex-direction: column; border: 1px solid rgba(204, 255, 0, 0.3); width: 74px; align-items: center; gap: 12px;}
            #fx-toolbar { flex-direction: column; border: 1px solid rgba(0, 240, 255, 0.3); width: 84px; align-items: center; gap: 12px;}
            #scroll-toolbar { flex-direction: column; border: 1px solid rgba(176, 38, 255, 0.35); width: 84px; align-items: center; gap: 12px;}
            input[type=range] { transform: rotate(-90deg); width: 90px; height: 4px; margin: 45px 0; cursor: pointer; }
            .toolbar-divider { width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 4px 0; }
        }

        /* CONFIGURATION RESPONSIVE CRUCIALE POUR LE MODE PORTRAIT SUR SMARTPHONE */
        @media (max-width: 768px) and (orientation: portrait) {
            .right-control-dock {
                left: 10px; right: 10px; bottom: calc(20px + var(--safe-bottom)); top: auto; flex-direction: row; justify-content: center;
                width: calc(100vw - 20px); flex-wrap: wrap;
            }
            #anno-toolbar, #fx-toolbar, #scroll-toolbar {
                flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; width: 100%; border: 1px solid rgba(255,255,255,0.1);
            }
            #anno-toolbar { border-color: var(--neon-lime); }
            #fx-toolbar { border-color: var(--neon-blue); }
            #scroll-toolbar { border-color: var(--neon-purple); }
            input[type=range] { transform: none; width: 100px; height: 6px; margin: 0 5px; }
            .toolbar-divider { height: 20px; width: 1px; background: rgba(255,255,255,0.1); margin: 0 4px; }
            .size-btn, .color-dot { width: 28px; height: 28px; }
            #anno-toolbar .btn-jazz { width: auto; padding: 4px 8px; font-size: 8px; }
            canvas, img { height: 62vh !important; } /* Réduction pour laisser la place aux barres horizontales */
        }

        /* iPad Air 13" & grandes tablettes en paysage : on profite de l'espace
           disponible pour afficher les partitions plus grandes sans sacrifier
           la zone des contrôles, et on agrandit légèrement les docks d'outils. */
        @media (min-width: 1024px) and (orientation: landscape) {
            canvas, img { height: 86vh !important; }
            #anno-toolbar, #fx-toolbar, #scroll-toolbar { width: 92px; padding: 16px; }
        }
        
        .color-dot { border-radius: 6px; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.2s; flex-shrink: 0; }
        .color-dot.active { border-color: white; transform: scale(1.15); box-shadow: 0 0 10px currentColor; }
        
        .size-btn { display: flex; align-items: center; justify-content: center; border: 1px solid #2d2d37; border-radius: 6px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .size-btn.active { border-color: var(--neon-lime); background: rgba(204, 255, 0, 0.12); }
        .size-preview { background-color: #888; border-radius: 50%; }
        .size-btn.active .size-preview { background-color: var(--neon-lime); }

        .sidebar-item {
            padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: 11px; color: #828292; cursor: grab; transition: 0.2s;
            display: flex; align-items: center; justify-content: space-between;
            background: #06060a;
        }
        .sidebar-item:active { cursor: grabbing; }
        .sidebar-item.active { background: rgba(204, 255, 0, 0.06); color: var(--neon-lime); font-weight: bold; border-left: 4px solid var(--neon-lime); }

        .lang-switch { font-size: 9px; border: 1px solid #2d2d37; padding: 3px 7px; border-radius: 4px; color: #727282; cursor: pointer; font-weight: bold; }
        .lang-switch.active { color: var(--neon-lime); border-color: var(--neon-lime); background: rgba(204, 255, 0, 0.08); }

        .source-tag { background: #0f0f14; border: 1px solid #2d2d37; padding: 5px 12px; border-radius: 5px; font-size: 10px; color: var(--neon-blue); font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .source-delete { color: var(--neon-pink); cursor: pointer; font-size: 13px; }

        .copyright { position: fixed; bottom: 15px; left: 25px; font-size: 9px; color: #2d2d37; z-index: 50; letter-spacing: 0.5px; }
        #alpha-bar button { padding: 6px 9px; font-size: 12px; font-weight: 800; color: #4b4b58; transition: 0.2s; }
        #alpha-bar button:hover { color: var(--neon-lime); transform: scale(1.2); }
        
        .fx-indicator { font-size: 9px; color: #626272; font-weight: bold; text-transform: uppercase; text-align: center; }

        /* Respect des préférences d'accessibilité : on coupe les animations
           décoratives (pulsation auto-scroll, transitions) si l'utilisateur a
           demandé "réduire les animations" au niveau système (iPadOS/Android). */
        @media (prefers-reduced-motion: reduce) {
            #autoscroll-play.on { animation: none; }
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }

        /* Petit indicateur discret affiché brièvement en haut de la visionneuse
           lorsqu'une action d'auto-scroll change d'état (info-bulle "toast"). */
        .toast-neon {
            position: fixed; top: calc(70px + var(--safe-top)); left: 50%; transform: translateX(-50%);
            background: rgba(6,6,10,0.95); border: 1px solid var(--neon-purple); color: #fff;
            font-size: 11px; font-weight: 700; padding: 8px 18px; border-radius: 8px; z-index: 9999;
            box-shadow: 0 0 18px rgba(176,38,255,0.4); letter-spacing: 0.5px; pointer-events: none;
        }

        /* =====================================================================
           v8 — ACCESSIBILITÉ / SAFE AREA / IPAD AIR 13" / ANDROID
           ===================================================================== */
        :root {
            --top-ui: 72px;
            --bottom-ui: 92px;
            --touch-min: 48px;
            --neon-glow: 0 0 18px rgba(0,240,255,.22), 0 0 32px rgba(204,255,0,.10);
        }

        html {
            background: var(--bg);
            min-height: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        button, input, select {
            font: inherit;
        }

        button {
            touch-action: manipulation;
        }

        .sr-only {
            position: fixed !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0,0,0,0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        /* La navigation fixe ne doit jamais masquer le début de la bibliothèque. */
        #sec-lib, #sec-set {
            padding-top: calc(104px + var(--safe-top)) !important;
            padding-bottom: calc(140px + var(--safe-bottom)) !important;
            scroll-padding-top: calc(104px + var(--safe-top));
        }

        .library-action-dock {
            position: sticky;
            top: calc(72px + var(--safe-top));
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 18px 0;
            padding: 12px;
            border: 1px solid rgba(0,240,255,.24);
            border-radius: 14px;
            background:
                linear-gradient(120deg, rgba(5,5,8,.97), rgba(12,12,20,.95)),
                radial-gradient(circle at 10% 50%, rgba(204,255,0,.10), transparent 35%);
            box-shadow: var(--neon-glow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .library-action-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 190px;
            color: #a6a6b7;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.2px;
            white-space: nowrap;
        }

        .neon-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--neon-lime);
            box-shadow: 0 0 12px var(--neon-lime);
            animation: dock-dot-pulse 1.8s ease-in-out infinite;
        }

        @keyframes dock-dot-pulse {
            0%,100% { transform: scale(.9); opacity: .75; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .library-action-buttons {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .library-action-buttons .btn-jazz {
            min-height: 48px;
            padding: 10px 14px;
            font-size: 10px;
            box-shadow: 0 0 14px rgba(0,240,255,.08);
        }

        .scan-primary {
            border-color: var(--neon-lime) !important;
            color: var(--neon-lime) !important;
        }

        .scan-secondary {
            border-color: var(--neon-blue) !important;
            color: var(--neon-blue) !important;
        }

        .scan-photo {
            border-color: var(--neon-pink) !important;
            color: var(--neon-pink) !important;
        }

        .scan-support-hint {
            position: absolute;
            left: 12px;
            bottom: -18px;
            color: #5d5d6d;
            font-size: 8px;
            pointer-events: none;
        }

        /* Dock miroir fixe : l'utilisateur peut toujours importer sans remonter. */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(1px + var(--safe-bottom));
            background: rgba(2,2,4,.98);
            z-index: 599;
            pointer-events: none;
        }

        #viewer-touch-strip {
            position: fixed;
            left: 50%;
            bottom: calc(12px + var(--safe-bottom));
            transform: translateX(-50%);
            z-index: 560;
            display: flex;
            gap: 6px;
            padding: 7px;
            border: 1px solid rgba(0,240,255,.22);
            border-radius: 16px;
            background: rgba(5,5,8,.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 0 26px rgba(0,0,0,.75);
        }

        #viewer-touch-strip button {
            min-width: 48px;
            min-height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(255,255,255,.035);
            color: #d9d9e2;
            font-weight: 900;
        }

        #viewer-touch-strip button:active {
            transform: scale(.94);
            border-color: var(--neon-lime);
            color: var(--neon-lime);
        }

        /* Ne jamais placer un dock vertical sous les barres système. */
        .right-control-dock {
            padding-bottom: var(--safe-bottom);
            padding-right: var(--safe-right);
        }

        /* Contrôles plus grands sur tablette tactile. */
        @media (pointer: coarse) {
            .btn-jazz,
            .nav-rect,
            .tab-btn,
            .lang-switch {
                min-height: 48px;
            }

            .nav-rect {
                min-width: 120px;
            }

            .library-action-buttons .btn-jazz {
                min-width: 145px;
            }
        }

        @media (min-width: 1024px) and (orientation: landscape) {
            .library-action-dock {
                margin-left: 0;
                margin-right: 0;
            }

            #viewer-touch-strip {
                display: none;
            }

            #viewer-content {
                padding-bottom: calc(520px + var(--safe-bottom));
            }
        }

        @media (max-width: 900px) {
            .library-action-dock {
                align-items: stretch;
                flex-direction: column;
            }

            .library-action-title {
                min-width: 0;
            }

            .library-action-buttons {
                width: 100%;
                justify-content: stretch;
            }

            .library-action-buttons .btn-jazz {
                flex: 1 1 30%;
                min-width: 0;
            }
        }

        @media (max-width: 600px) {
            .library-action-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
            }

            .library-action-buttons .btn-jazz {
                width: 100%;
                padding-left: 7px;
                padding-right: 7px;
                font-size: 9px;
            }

            .scan-support-hint {
                display: none;
            }

            .desktop-scan-legacy {
                display: none;
            }

            #viewer-header {
                padding-top: calc(6px + var(--safe-top)) !important;
            }

            #viewer-nav {
                bottom: calc(82px + var(--safe-bottom)) !important;
            }
        }

        /* Mode plein écran : l'interface de lecture garde une marge sûre. */
        :fullscreen #sec-view,
        :-webkit-full-screen #sec-view {
            background: #000;
        }

        :fullscreen #viewer-header {
            padding-top: max(8px, var(--safe-top));
        }

        /* États clavier / focus : utile avec trackpad et claviers iPad. */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--neon-lime);
            outline-offset: 2px;
        }

        /* Le zoom > 100% doit rester utilisable horizontalement sans couper les pages. */
        #viewer-content {
            overflow: visible;
            will-change: scroll-position;
        }

        .page-wrapper {
            contain: layout paint;
            will-change: transform;
        }

        /* Réduit les risques de "clic fantôme" après un geste iPad. */
        .file-row,
        .sidebar-item,
        .btn-jazz,
        .nav-rect {
            -webkit-touch-callout: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .neon-dot {
                animation: none;
            }
        }


        /* =====================================================================
           v10 — IPAD STABLE TOUCH LAYER
           IMPORTANT: this is deliberately additive. The original v8 controls,
           rendering and navigation remain intact.
           ===================================================================== */

        /* v8 used touch-action:none on BODY. That can suppress Safari's native
           scrolling/gesture arbitration. Keep the page itself non-scrolling,
           but let the actual scroll surfaces receive native gestures. */
        body {
            touch-action: manipulation;
        }

        #sec-lib, #sec-set {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y;
        }

        #scroll-container {
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            overflow: auto;
            cursor: default;
        }

        #scroll-container canvas:not(.anno-canvas),
        #scroll-container img,
        #scroll-container .page-wrapper {
            touch-action: pinch-zoom;
        }

        /* Annotation canvas keeps its original behavior only when drawing is on. */
        #scroll-container:not(.anno-active) .anno-canvas {
            pointer-events: none;
            touch-action: pinch-zoom;
        }
        #scroll-container.anno-active .anno-canvas {
            touch-action: none;
        }

        /* Alphabet: existing v8 #alpha-bar, made large enough for an iPad finger
           and horizontally scrollable instead of wrapping into tiny targets. */
        #alpha-bar {
            position: sticky !important;
            top: calc(72px + var(--safe-top)) !important;
            z-index: 140 !important;
            display: flex !important;
            flex-wrap: nowrap !important;
            justify-content: flex-start !important;
            align-items: center !important;
            gap: 3px !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            min-height: 52px;
            padding: 5px 8px !important;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            scrollbar-width: none;
        }
        #alpha-bar::-webkit-scrollbar { display: none; }
        #alpha-bar button {
            flex: 0 0 42px;
            width: 42px;
            min-width: 42px;
            height: 42px;
            min-height: 42px;
            border: 1px solid rgba(0,240,255,.15);
            border-radius: 10px;
            background: rgba(255,255,255,.025);
            color: #777784;
            touch-action: manipulation;
        }
        #alpha-bar button:active,
        #alpha-bar button:focus-visible {
            color: #050508;
            background: var(--neon-lime);
            border-color: var(--neon-lime);
            box-shadow: 0 0 18px rgba(204,255,0,.35);
            outline: none;
        }

        /* Drag & drop target for desktop and iPad Files app drag gestures. */
        #sec-lib.v10-drag-over,
        #library-list.v10-drag-over,
        #source-list.v10-drag-over {
            outline: 2px dashed var(--neon-lime);
            outline-offset: -5px;
            background: rgba(204,255,0,.035);
        }
        .v10-drop-hint {
            position: fixed;
            left: 50%;
            bottom: calc(18px + var(--safe-bottom));
            transform: translateX(-50%);
            z-index: 1200;
            pointer-events: none;
            display: none;
            padding: 12px 18px;
            border: 1px solid var(--neon-lime);
            border-radius: 12px;
            background: rgba(3,3,6,.96);
            color: var(--neon-lime);
            box-shadow: 0 0 30px rgba(204,255,0,.25);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: .7px;
        }
        body.v10-drop-active .v10-drop-hint { display: block; }

        /* iPad safe area: never let the fixed viewer controls cover the page. */
        @media (pointer: coarse) {
            #scroll-container {
                padding-bottom: calc(110px + var(--safe-bottom));
            }
            #viewer-touch-strip {
                bottom: calc(12px + var(--safe-bottom));
            }
            #viewer-nav {
                bottom: calc(76px + var(--safe-bottom));
            }
        }

        @media (max-width: 700px) {
            #alpha-bar button {
                flex-basis: 44px;
                width: 44px;
                min-width: 44px;
                height: 44px;
            }
        }

    </style>
</head>
<body>

    <div class="copyright font-black uppercase">© Cdc </div>

    <nav class="glass fixed top-0 w-full flex justify-around p-4 z-[200]">
        <button onclick="switchTab('lib')" id="tab-lib" class="tab-btn tab-active" data-i18n="nav_lib">Répertoire</button>
        <button onclick="switchTab('set')" id="tab-set" class="tab-btn" data-i18n="nav_set">Setlists</button>

        <div class="absolute right-4 top-1/2 -translate-y-1/2 flex gap-1">

    <section id="sec-lib" class="pt-22 h-screen overflow-y-auto px-4 md:px-6">
        <div class="flex justify-between items-end mb-6 mt-4">
            <div>
                <h1 class="jazz-title text-3xl md:text-4xl mb-1">Partoches</h1>
                <div id="source-list" class="flex flex-wrap gap-2"></div>

        <!-- =====================================================================
             v8 — SCAN DOCK TOUJOURS ACCESSIBLE
             Les actions d'import sont dupliquées dans un dock sticky + bottom-safe.
             Cela évite tout recouvrement par la barre Safari/Chrome, le dock système,
             le clavier virtuel ou les zones sûres iPadOS/Android.
             ===================================================================== -->
        <div id="library-action-dock" class="library-action-dock" aria-label="Importation">
            <div class="library-action-title">
                <span class="neon-dot"></span>
                <span data-i18n="scan_title">IMPORTER UNE BIBLIOTHÈQUE</span>
            </div>
            <div class="library-action-buttons">
                <button id="btn-scan-folder" class="btn-jazz scan-primary" onclick="scanFolderEntry()"
                        data-i18n="btn_scan_folder">📁 Dossier récursif</button>
                <button id="btn-scan-files" class="btn-jazz scan-secondary" onclick="scanFilesEntry()"
                        data-i18n="btn_scan_files">📄 Fichiers</button>
                <button id="btn-scan-photos" class="btn-jazz scan-photo" onclick="scanPhotosEntry()"
                        data-i18n="btn_scan_photos">📷 Photos</button>
            </div>
            <div id="scan-support-hint" class="scan-support-hint"></div>
        </div>

        <!-- Inputs séparés : ils sont créés une seule fois et déclenchés par les boutons.
             webkitdirectory permet le scan récursif quand le navigateur l'expose. -->
        <input id="file-input-recursive" class="sr-only" type="file" multiple
               webkitdirectory directory
               accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf">
        <input id="file-input-files" class="sr-only" type="file" multiple
               accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf">
        <input id="file-input-photos" class="sr-only" type="file" multiple
               accept="image/*" capture="environment">
            </div>
            <div class="flex gap-2">
                <button id="btn-restore" onclick="restoreAccess()" class="hidden btn-jazz !border-blue-500 !text-blue-500" data-i18n="btn_restore">Rétablir Accès</button>
                <button onclick="scanFolderEntry()" class="btn-jazz desktop-scan-legacy" data-i18n="btn_scan">Scanner Dossier</button>
            </div>
        </div>
        <div id="alpha-bar" class="sticky top-0 z-20 flex flex-wrap justify-center bg-black/90 backdrop-blur-md py-2 border-b border-white/5 shadow-2xl rounded-md"></div>
        <div id="library-list" class="pb-40 mt-4"></div>
    </section>

    <section id="sec-set" class="hidden pt-22 h-screen overflow-y-auto px-4 md:px-6">
        <div class="max-w-xl mx-auto text-center mt-4">
            <h2 class="jazz-title text-2xl mb-6" data-i18n="set_title">Programmation</h2>
            <div id="set-list-current" class="bg-[#050508] border border-white/5 rounded-lg min-h-[220px] mb-6 p-4"></div>
            <div class="grid grid-cols-2 gap-4 mb-10">
                <button onclick="saveCurrentSet()" class="btn-jazz !py-4 text-[11px]" data-i18n="btn_save_set">Enregistrer Set</button>
                <button onclick="clearCurrentSet()" class="text-[10px] uppercase font-bold text-zinc-600 hover:text-white transition" data-i18n="btn_clear">Vider</button>
            </div>
            <div class="text-left">
                <h3 class="text-[10px] uppercase tracking-widest text-zinc-500 mb-4 font-bold">Sauvegardes</h3>
                <div id="saved-sets-list" class="space-y-2 pb-40"></div>
            </div>
        </div>
    </section>

    <section id="sec-view" class="fixed inset-0 bg-black hidden z-[310] overflow-hidden">
        
        <div id="viewer-header" class="glass absolute top-0 w-full p-2 md:p-3 flex justify-between items-center z-[500] transition-opacity duration-300">
            <div class="flex items-center gap-1 md:gap-2">
                <button onclick="goToHome()" class="btn-jazz !border-none !text-lime-400 !px-2 font-bold" data-i18n="btn_home">🏠 Accueil</button>
                <button onclick="switchTab('lib')" class="btn-jazz !border-none !text-zinc-500 !px-1 md:px-2" data-i18n="btn_close">✕</button>
                <button onclick="toggleSidebar()" class="btn-jazz !border-zinc-800 !px-2">☰ Menu</button>
            </div>
            
            <div class="flex items-center gap-2 md:gap-3">
                <button onclick="prevFile()" class="btn-jazz !border-zinc-700 !text-zinc-300 !px-2">◀</button>
                <div class="flex items-center bg-zinc-900 rounded-lg px-1 border border-white/5">
                    <button onclick="adjustZoom(-0.15)" class="px-2 md:px-3 py-1 text-zinc-400 hover:text-white font-bold text-sm">-</button>
                    <span id="zoom-level" class="text-[11px] w-12 text-center font-bold text-lime-400">100%</span>
                    <button onclick="adjustZoom(0.15)" class="px-2 md:px-3 py-1 text-zinc-400 hover:text-white font-bold text-sm">+</button>
                </div>
                <button onclick="nextFile()" class="btn-jazz !border-zinc-700 !text-zinc-300 !px-2">▶</button>
            </div>

            <div class="flex items-center gap-1 md:gap-3">
                <!-- NOUVEAU v7 : bascule l'affichage de la barre d'auto-scroll.
                     Le bouton s'illumine en violet dès que le défilement
                     automatique est actif, même si la barre est repliée. -->
                <button onclick="toggleScrollToolbar()" id="scroll-toggle-btn" class="btn-jazz !border-zinc-700 !text-zinc-400 !px-2" data-i18n="btn_autoscroll" title="Auto-défilement">Scroll ▶</button>
                <button onclick="toggleFX()" id="fx-toggle-btn" class="btn-jazz !border-zinc-700 !text-zinc-400 !px-2" data-i18n="btn_settings">Filtres</button>
                <button onclick="toggleDrawingMode()" id="draw-toggle" class="btn-jazz !px-2" data-i18n="btn_draw">Dessin</button>
                <button onclick="toggleFullscreen()" id="fullscreen-toggle" class="btn-jazz !border-cyan-500 !text-cyan-300 !px-2" data-i18n="btn_fullscreen" title="Plein écran">⛶</button>
                <!-- Boutons rotation : antihoraire / horaire — reset automatique à chaque partition -->
                <div class="flex items-center bg-zinc-900 rounded-lg border border-white/5" title="Rotation (non conservée)">
                    <button onclick="event.stopPropagation(); rotatePage(-1)" class="px-2 py-1 text-zinc-400 hover:text-white font-bold text-sm" title="Rotation antihoraire">↺</button>
                    <span id="rotate-label" class="text-[10px] w-7 text-center font-bold text-zinc-500">↺↻</span>
                    <button onclick="event.stopPropagation(); rotatePage(+1)" class="px-2 py-1 text-zinc-400 hover:text-white font-bold text-sm" title="Rotation horaire">↻</button>
                </div>
                <div id="page-info" class="text-white/40 font-bold text-[10px] pr-1 italic hidden sm:block">0 / 0</div>
            </div>
        </div>

        <div id="view-layout">
            <aside id="viewer-sidebar">
                <div class="p-4 border-b border-white/5 font-black text-[9px] tracking-widest text-zinc-500 uppercase">Live Tracklist</div>
                <div id="sidebar-items" class="flex-grow overflow-y-auto"></div>
            </aside>

            <div id="scroll-container" onwheel="handleWheel(event)" onclick="toggleUI()">
                <div id="viewer-content"></div>
            </div>
        </div>

        <div id="viewer-nav" class="absolute bottom-8 w-full flex justify-between px-12 pointer-events-none z-[400] transition-opacity duration-300 sm:flex">
            <button onclick="event.stopPropagation(); prevFile()" class="nav-rect" data-i18n="btn_prev">Précédent</button>
            <button onclick="event.stopPropagation(); nextFile()" class="nav-rect" data-i18n="btn_next">Suivant</button>
        </div>


        <!-- v8 : commandes tactiles secondaires, toujours au-dessus de la safe-area -->
        <div id="viewer-touch-strip" class="viewer-touch-strip">
            <button onclick="prevFile()" aria-label="Partition précédente">◀</button>
            <button onclick="adjustZoom(-0.10)" aria-label="Zoom arrière">−</button>
            <button onclick="resetViewerView()" aria-label="Réinitialiser la vue">100%</button>
            <button onclick="adjustZoom(0.10)" aria-label="Zoom avant">+</button>
            <button onclick="nextFile()" aria-label="Partition suivante">▶</button>
        </div>

        <div class="right-control-dock">
            <div id="anno-toolbar">
                <div onclick="setAnnoColor('#ccff00', this)" class="color-dot active style-lime" style="width:30px; height:30px; background:#ccff00; color:#ccff00;"></div>
                <div onclick="setAnnoColor('#00f0ff', this)" class="color-dot style-blue" style="width:30px; height:30px; background:#00f0ff; color:#00f0ff;"></div>
                <div onclick="setAnnoColor('#ff00ff', this)" class="color-dot style-pink" style="width:30px; height:30px; background:#ff00ff; color:#ff00ff;"></div>
                <div onclick="setAnnoColor('#ff6600', this)" class="color-dot style-orange" style="width:30px; height:30px; background:#ff6600; color:#ff6600;"></div>
                <div onclick="setAnnoColor('red', this)" class="color-dot style-red" style="width:30px; height:30px; background:red; color:red;"></div>
                
                <div class="toolbar-divider"></div>
                
                <div onclick="setAnnoSize(3, this)" class="size-btn" style="width:32px; height:32px;"><div class="size-preview" style="width:4px; height:4px;"></div></div>
                <div onclick="setAnnoSize(7, this)" class="size-btn active" style="width:32px; height:32px;"><div class="size-preview" style="width:8px; height:8px;"></div></div>
                <div onclick="setAnnoSize(15, this)" class="size-btn" style="width:32px; height:32px;"><div class="size-preview" style="width:14px; height:14px;"></div></div>
                
                <div class="toolbar-divider"></div>
                
                <div onclick="setAnnoColor('eraser', this)" class="btn-jazz !px-2 !py-1 text-center !text-[9px]" data-i18n="btn_del">Gomme</div>
                <button onclick="undoLast()" class="btn-jazz !px-2 !py-1 !text-[9px] !border-zinc-700 !text-zinc-400">Undo</button>
                <button onclick="clearCurrentPage()" class="btn-jazz !px-2 !py-1 !text-[9px] !border-pink-950 !text-pink-500">Effacer</button>
            </div>

            <div id="fx-toolbar">
                <div class="fx-indicator"><span data-i18n="fx_bright">Lum</span> <span id="val-bright" class="text-lime-400">100%</span></div>
                <input type="range" min="0.4" max="2" step="0.05" value="1" oninput="updateFX('bright', this.value)">
                
                <div class="toolbar-divider"></div>
                
                <div class="fx-indicator"><span data-i18n="fx_contrast">Cont</span> <span id="val-contrast" class="text-lime-400">100%</span></div>
                <input type="range" min="0.4" max="2.5" step="0.05" value="1" oninput="updateFX('contrast', this.value)">
            </div>

            <!-- ==================================================================
                 NOUVEAU v7 — BARRE D'AUTO-SCROLL
                 Défilement automatique fluide de la partition, pensé pour être
                 utilisé mains libres pendant un concert. Il NE modifie jamais
                 le zoom, la rotation, ni les calques de dessin : il se contente
                 d'incrémenter scrollTop sur #scroll-container à chaque frame,

            <div id="scroll-toolbar">

                <div class="toolbar-divider"></div>
                <label class="chain-toggle">
                    <input type="checkbox" id="autoscroll-chain" onchange="setAutoScrollChain(this.checked)">
                    <span class="autoscroll-label" data-i18n="scroll_chain" style="text-align:left;">Enchaîner Setlist</span>
                </label>
            </div>
        </div>

    <script>
        const i18n = {
            fr: {
                nav_lib: "Répertoire", nav_set: "Setlists", nav_view: "Visionneuse",
                scan_title: "Importer une bibliothèque", btn_scan_folder: "📁 Dossier récursif",
                btn_scan_files: "📄 Fichiers", btn_scan_photos: "📷 Photos",
                btn_fullscreen: "Plein écran", scan_folder_hint: "Dossier récursif disponible selon le navigateur",
                btn_restore: "Rétablir Accès", btn_scan: "Scanner Dossier",
                set_title: "Programmation", btn_save_set: "Enregistrer Set", btn_clear: "Vider",
                btn_close: "✕ Fermer", btn_settings: "Filtres", btn_draw: "Dessin",
                fx_bright: "Lum", fx_contrast: "Cont", btn_del: "Gomme",
                btn_prev: "Précédent", btn_next: "Suivant", btn_add: "Ajouter", btn_home: "🏠 Accueil",
                btn_autoscroll: "Scroll ▶", scroll_title: "Auto-Scroll", scroll_speed: "Vitesse", scroll_chain: "Enchaîner Setlist"
            },
            en: {
                nav_lib: "Library", nav_set: "Setlists", nav_view: "Viewer",
                scan_title: "Import library", btn_scan_folder: "📁 Recursive folder",
                btn_scan_files: "📄 Files", btn_scan_photos: "📷 Photos",
                btn_fullscreen: "Fullscreen", scan_folder_hint: "Recursive folder support depends on browser",
                btn_restore: "Restore Access", btn_scan: "Scan Folder",
                set_title: "Setlists", btn_save_set: "Save Setlist", btn_clear: "Clear",
                btn_close: "✕ Close", btn_settings: "Filters", btn_draw: "Draw",
                fx_bright: "Bright", fx_contrast: "Cont", btn_del: "Eraser",
                btn_prev: "Previous", btn_next: "Next", btn_add: "Add", btn_home: "🏠 Home",
                btn_autoscroll: "Scroll ▶", scroll_title: "Auto-Scroll", scroll_speed: "Speed", scroll_chain: "Chain Setlist"
            }
        };

        let currentLang = localStorage.getItem('part_lang') || 'fr';
        let files = [], setFiles = [], currentIndex = 0, sources = [];
        let uiVisible = true, currentZoom = 1.0, isDrawingMode = false, isFxMode = false;
        let annoColor = '#ccff00', annoSize = 7;
        let annotations = JSON.parse(localStorage.getItem('part_annos_v3') || '{}');
        let undoStack = [];
        let currentRotation = 0;  // 0, 90, 180, 270 — reset à chaque partition
        let zoomMemory = 1.0;     // Zoom conservé entre partitions d'un même set
        
        let tpCache = [];
        let startDist = 0;
        let startZoom = 1.0;

        // =====================================================================
        // NOUVEAU v7 — ÉTAT DE L'AUTO-SCROLL
        // =====================================================================
        // Le moteur repose sur requestAnimationFrame pour un défilement fluide
        // indépendant du taux de rafraîchissement de l'écran (60/120 Hz sur
        // iPad Pro/Air ProMotion notamment). La vitesse est exprimée en

        // Objectifs :

        const SUPPORTED_SCORE_EXT = /\.(pdf|png|jpg|jpeg|webp)$/i;

        function getEntryDisplayName(file) {
            return file.webkitRelativePath || file.name;
        }

        function makeVirtualEntry(file) {
            const displayName = getEntryDisplayName(file);
            return {
                entry: {
                    name: displayName,
                    baseName: file.name,
                    relativePath: file.webkitRelativePath || file.name,
                    _blob: file,
                    kind: 'file',
                    getFile: () => Promise.resolve(file)
                }
            };
        }

        function mergeVirtualFiles(newFiles, sourceLabel) {
            const accepted = [];
            const seen = new Set(
                files.map(f => String(f.entry.relativePath || f.entry.name).toLowerCase())
            );

            for (const file of newFiles) {
                if (!SUPPORTED_SCORE_EXT.test(file.name)) continue;
                const key = String(file.webkitRelativePath || file.name).toLowerCase();
                if (seen.has(key)) continue;
                seen.add(key);
                accepted.push(makeVirtualEntry(file));
            }

            if (!accepted.length) {
                showToast(currentLang === 'fr'
                    ? 'Aucun PDF ou fichier image compatible.'
                    : 'No compatible PDF or image file.');
                return 0;
            }

            let src = sources.find(s => s._virtual && s.name === sourceLabel);
            if (!src) {
                src = { name: sourceLabel, _virtual: true, _files: [] };
                sources.push(src);
            }

            src._files = (src._files || []).concat(accepted);
            files.push(...accepted);
            renderLibrary();
            renderSourcesUI();

            showToast(currentLang === 'fr'
                ? `${accepted.length} fichier(s) ajouté(s)`
                : `${accepted.length} file(s) added`);

            return accepted.length;
        }

        async function scanFolderEntry() {
            // 1. Desktop Chromium / Android Chromium quand l'API est exposée.
            if (typeof window.showDirectoryPicker === 'function') {
                try {
                    const h = await window.showDirectoryPicker({ mode: 'read' });
                    if (sources.some(s => !s._virtual && s.name === h.name)) {
                        showToast(currentLang === 'fr'
                            ? 'Ce dossier est déjà ajouté.'
                            : 'This folder is already added.');
                        return;
                    }

                    const db = await openDB();
                    db.transaction("sources", "readwrite")
                        .objectStore("sources").put(h, h.name);

                    sources.push(h);
                    await refreshFiles();
                    showToast(currentLang === 'fr'
                        ? 'Dossier récursif ajouté ✓'
                        : 'Recursive folder added ✓');
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                    console.warn('[Partoches v8] showDirectoryPicker:', e);
                }
            }

            // 2. Fallback navigateur : webkitdirectory = sélection récursive.
            const input = document.getElementById('file-input-recursive');
            if (input) {
                input.value = '';

                    const chosen = Array.from(input.files || []);
                    if (!chosen.length) return;

        /*
         * Alphabet
         * --------
         * v8 already had generateAlphaBar(). We keep that function and wrap it
         * only to make regeneration safe and the targets touch-friendly.
         */
        function refreshAlphaBarV10() {
            const bar = document.getElementById('alpha-bar');
            if (!bar) return;
            const previous = bar.dataset.v10Ready === '1';
            if (!previous) bar.dataset.v10Ready = '1';

            // Rebuild only when the bar is empty. This avoids duplicate letters
            // if the original v8 init calls generateAlphaBar more than once.
            if (bar.children.length === 0) {
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.innerText = letter;
                    b.setAttribute('aria-label',
                        (currentLang === 'fr' ? 'Aller aux partitions commençant par ' :
                         'Go to scores beginning with ') + letter);
                    b.onclick = () => {
                        renderLibrary(letter);
                        requestAnimationFrame(() => {
                            const first = document.querySelector('#library-list .file-row');
                            if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        });
                    };
                    bar.appendChild(b);
                });
            }
        }

        // Keep the original renderLibrary and simply make the alpha bar resilient.
        function installAlphaResilienceV10() {
            refreshAlphaBarV10();
            if (typeof renderLibrary === 'function' && !renderLibrary.__v10AlphaWrapped) {
                const originalRenderLibraryV10 = renderLibrary;
                const wrappedRenderLibraryV10 = function(...args) {
                    const result = originalRenderLibraryV10.apply(this, args);
                    requestAnimationFrame(refreshAlphaBarV10);
                    return result;
                };
                wrappedRenderLibraryV10.__v10AlphaWrapped = true;
                renderLibrary = wrappedRenderLibraryV10;
            }
        }

        /*
         * Drag & Drop
         * -----------
         * Desktop: normal dragover/drop.
         * iPadOS: Safari can receive a file dragged from the Files app when the
         * browser surface advertises a drop target. We never replace the
         * existing file pickers; this is an additional route.
         */
        function createV10DropHint() {
            if (document.getElementById('v10-drop-hint')) return;
            const hint = document.createElement('div');
            hint.id = 'v10-drop-hint';
            hint.className = 'v10-drop-hint';

                ? 'RELÂCHER POUR IMPORTER'

        async function importDroppedFilesV10(fileList) {
            const list = Array.from(fileList || []);
            if (!list.length) return;

            const accepted = list.filter(file => {
                const n = file.name.toLowerCase();
                return /\.(pdf|png|jpe?g|webp)$/i.test(n);
            });

            if (!accepted.length) {
                showToast(currentLang === 'fr'
                    ? 'Aucun PDF ou fichier image compatible.'
                    : 'No compatible PDF or image file.');
                return;
            }

            // Use the application's existing merge/import pipeline.
            await mergeVirtualFiles(accepted,
                currentLang === 'fr' ? 'Glisser-déposer' : 'Drag & Drop');
            requestAnimationFrame(() => {
                refreshAlphaBarV10();
                renderLibrary('');
            });
        }

        function installDragDropV10() {
            if (document.body.dataset.v10DndReady === '1') return;
            document.body.dataset.v10DndReady = '1';
            createV10DropHint();

            const targets = [
                document.getElementById('sec-lib'),
                document.getElementById('library-list'),
                document.getElementById('source-list')
            ].filter(Boolean);

            let dragDepth = 0;

            targets.forEach(target => {
                target.addEventListener('dragenter', e => {
                    if (!e.dataTransfer) return;
                    if (!Array.from(e.dataTransfer.types || []).includes('Files')) return;
                    e.preventDefault();
                    dragDepth++;
                    target.classList.add('v10-drag-over');
                    document.body.classList.add('v10-drop-active');
                });

                target.addEventListener('dragover', e => {
                    if (!e.dataTransfer) return;
                    if (!Array.from(e.dataTransfer.types || []).includes('Files')) return;
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'copy';
                    target.classList.add('v10-drag-over');
                    document.body.classList.add('v10-drop-active');
                });

                target.addEventListener('dragleave', e => {
                    dragDepth = Math.max(0, dragDepth - 1);
                    if (dragDepth === 0) {
                        targets.forEach(t => t.classList.remove('v10-drag-over'));
                        document.body.classList.remove('v10-drop-active');
                    }
                });

                target.addEventListener('drop', async e => {
                    e.preventDefault();
                    dragDepth = 0;
                    targets.forEach(t => t.classList.remove('v10-drag-over'));
                    document.body.classList.remove('v10-drop-active');
                    await importDroppedFilesV10(e.dataTransfer?.files);
                });
            });

            window.addEventListener('dragend', () => {
                dragDepth = 0;
                targets.forEach(t => t.classList.remove('v10-drag-over'));
                document.body.classList.remove('v10-drop-active');
            }, { passive: true });
        }

        /*
         * Pinch
         * -----
         * v8 already implements pinch. The important v10 change is not to replace
         * it: we restore Safari's gesture arbitration via CSS and add a very
         * small, non-invasive fallback for browsers that expose Pointer Events
         * but deliver incomplete TouchEvent sequences.
         */
        function installPinchFallbackV10() {
            const el = document.getElementById('scroll-container');
            if (!el || el.dataset.v10PinchReady === '1') return;
            el.dataset.v10PinchReady = '1';

            let active = false;
            let baseDistance = 0;
            let baseZoom = 1;

            const distance = (a, b) =>
                Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

            el.addEventListener('touchstart', e => {
                if (e.touches.length !== 2) return;
                active = true;
                baseDistance = distance(e.touches[0], e.touches[1]);
                baseZoom = currentZoom;
            }, { passive: true });

            el.addEventListener('touchmove', e => {
                if (!active || e.touches.length !== 2 || !baseDistance) return;

                const factor = distance(e.touches[0], e.touches[1]) / baseDistance;
                const next = Math.max(.5, Math.min(3.0, baseZoom * factor));

                // The original setupPinchZoom remains the primary implementation.
                // Only use this fallback when its zoom value has not changed yet.
                if (Math.abs(currentZoom - baseZoom) < 0.0001) {
                    currentZoom = next;
                    applyPageScales();
                }
            }, { passive: true });

            const stop = () => {
                active = false;
                baseDistance = 0;
            };
            el.addEventListener('touchend', stop, { passive: true });
            el.addEventListener('touchcancel', stop, { passive: true });
        }

        /*
         * Native scroll
         * -------------
         * Do not implement a fake scroll loop: Safari's native scroll is smoother
         * and integrates correctly with momentum scrolling. This layer merely
         * makes the intended surface explicit and restores wheel behavior.
         */
        function installNativeScrollV10() {
            const el = document.getElementById('scroll-container');
            if (!el || el.dataset.v10ScrollReady === '1') return;
            el.dataset.v10ScrollReady = '1';

            el.style.overflow = 'auto';
            el.style.webkitOverflowScrolling = 'touch';
            el.style.touchAction = 'pan-x pan-y pinch-zoom';

            el.addEventListener('wheel', e => {
                // Keep v8's handleWheel() as the main wheel handler.
                // This is only a safety path for trackpads/browsers where the
                // inline handler is not invoked.
                if (typeof handleWheel !== 'function') {
                    el.scrollTop += e.deltaY;
                    el.scrollLeft += e.deltaX;
                }
            }, { passive: true });

            // iPad Safari: after a viewport/URL-bar resize, explicitly restore
            // the scroll surface without changing the current scroll position.
            const restoreScrollSurface = () => {
                const top = el.scrollTop;
                const left = el.scrollLeft;
                requestAnimationFrame(() => {
                    el.style.overflow = 'auto';
                    el.scrollTop = top;
                    el.scrollLeft = left;
                });
            };
            window.addEventListener('orientationchange', restoreScrollSurface, { passive: true });
            window.visualViewport?.addEventListener('resize', restoreScrollSurface, { passive: true });
        }

        function installV10StableIPadLayer() {
            installAlphaResilienceV10();
            installDragDropV10();
            installPinchFallbackV10();
            installNativeScrollV10();
        }


        async function init() {
            setLang(currentLang);
            loadViewPreferences();
            updateScanSupportHint();
            logPlatformProfile();

            // Adapter le label du bouton selon le support de l'API
            const btnScan = document.querySelector('[data-i18n="btn_scan"]');
            if (typeof window.showDirectoryPicker === 'undefined') {
                // iOS Safari ou navigateur sans File System Access API
                btnScan.setAttribute('data-i18n-ios', '1');
                const iosLabel = { fr: '+ Ajouter Fichiers', en: '+ Add Files' };
                btnScan.innerText = iosLabel[currentLang];
                btnScan.title = currentLang === 'fr'
                    ? 'Sur iOS, sélectionnez des fichiers individuels (PDF, images)'
                    : 'On iOS, select individual files (PDF, images)';
            }

            const db = await openDB();
            const req = db.transaction("sources", "readonly").objectStore("sources").getAll();
            req.onsuccess = async () => { 
                sources = req.result; 
                if(sources.length > 0) {
                    try {
                        let needsReauth = false;
                        for(const h of sources) { 
                            if (!h._virtual) {
                                const perm = await h.queryPermission({ mode: 'read' });
                                if(perm !== 'granted') needsReauth = true;
                            }
                        }
                        if (needsReauth) document.getElementById('btn-restore').classList.remove('hidden');
                        await refreshFiles();
                    } catch(e) { console.error("Restauration échouée:", e); }
                }
            };
            renderSavedSets();
            generateAlphaBar();
            setupPinchZoom();
            setupAutoScrollGuards();
            initViewportHeightFix();

            // v10: additive iPad/Android stability layer. Original v8 handlers
            // remain active; these only restore the browser gesture surface.
            requestAnimationFrame(installV10StableIPadLayer);

            // Restaurer les préférences d'auto-scroll (vitesse + enchaînement)
            const speedSlider = document.getElementById('autoscroll-speed-slider');
            if (speedSlider) { speedSlider.value = autoScrollSpeed; setAutoScrollSpeed(autoScrollSpeed); }
            const chainBox = document.getElementById('autoscroll-chain');
            if (chainBox) chainBox.checked = autoScrollChain;
            
            new Sortable(document.getElementById('sidebar-items'), {
                animation: 180,
                onEnd: function (evt) {
                    const movedItem = setFiles.splice(evt.oldIndex, 1)[0];
                    setFiles.splice(evt.newIndex, 0, movedItem);
                    if (currentIndex === evt.oldIndex) {
                        currentIndex = evt.newIndex;
                    } else if (currentIndex > evt.oldIndex && currentIndex <= evt.newIndex) {
                        currentIndex--;
                    } else if (currentIndex < evt.oldIndex && currentIndex >= evt.newIndex) {
                        currentIndex++;
                    }
                    document.getElementById('page-info').innerText = (currentIndex + 1) + " / " + setFiles.length;
                    renderSidebar();
                }
            });
            
            // Réaligner l'UI mobile lors d'un changement d'orientation
            window.addEventListener("orientationchange", () => {
                setTimeout(() => { setAppVH(); applyPageScales(); }, 350);
            });
            window.addEventListener("resize", () => {
                setTimeout(() => { setAppVH(); applyPageScales(); }, 100);
            });

            // NOUVEAU v7 : recalcule --app-vh quand le clavier virtuel Android
            // apparaît/disparaît ou que la barre Safari se rétracte au scroll,
            // via visualViewport si disponible (bien supporté iPadOS/Android récents).
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => setAppVH());
            }
        }

        // =====================================================================
        // NOUVEAU v7 — CORRECTIF DE HAUTEUR DE VIEWPORT iOS/ANDROID
        // =====================================================================
        // Le fameux problème "100vh" sur mobile : les barres d'adresse
        // rétractables de Safari iOS et Chrome Android changent la hauteur
        // réelle disponible sans redéclencher un vrai "resize" fiable, ce qui
        // provoque un contenu tronqué ou un espace blanc en bas d'écran.
        // Solution standard : mesurer window.innerHeight en JS et l'exposer
        // comme variable CSS --app-vh (1% de la hauteur réelle), utilisée à
        // la place de 100vh partout où c'est critique (voir <style> plus haut).
        function setAppVH() {
            const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
            document.documentElement.style.setProperty('--app-vh', vh + 'px');
        }
        function initViewportHeightFix() {
            setAppVH();
            window.addEventListener('resize', setAppVH);
        }

        // --- AJOUT DE SOURCE AVEC FALLBACK iOS/SAFARI ---
        // showDirectoryPicker n'est pas disponible sur iOS Safari.
        // Sur iOS, on propose un input file multiple comme alternative.
        async function addSource() {
            // Vérification support File System Access API
            if (typeof window.showDirectoryPicker === 'undefined') {
                // Fallback iOS/Safari : sélection multiple de fichiers
                addSourceFallbackIOS();
                return;
            }
            try {
                const h = await window.showDirectoryPicker({ mode: 'read' });
                if(sources.find(s => s.name === h.name)) {
                    alert(currentLang === 'fr' ? "Ce dossier est déjà ajouté." : "This folder is already added.");
                    return;
                }
                const db = await openDB();
                db.transaction("sources", "readwrite").objectStore("sources").put(h, h.name);
                sources.push(h);
                await refreshFiles();
            } catch(e) {
                if (e.name === 'AbortError') return; // Utilisateur a annulé
                // Erreur inattendue → proposer le fallback
                if (confirm(
                    currentLang === 'fr'
                        ? "Impossible d'accéder aux dossiers dans ce navigateur.\nVoulez-vous sélectionner vos fichiers manuellement ?"
                        : "Cannot access folders in this browser.\nDo you want to select your files manually?"
                )) {
                    addSourceFallbackIOS();
                }
            }
        }

        // Fallback : input file multiple pour iOS Safari et navigateurs sans File System Access API
        function addSourceFallbackIOS() {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.accept = '.pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf';
            input.style.display = 'none';
            document.body.appendChild(input);
            input.onchange = async () => {
                if (!input.files || input.files.length === 0) { input.remove(); return; }
                const newFiles = [];
                for (const file of input.files) {
                    if (file.name.match(/\.(pdf|png|jpg|jpeg|webp)$/i)) {
                        // Créer un objet compatible avec le reste du code
                        newFiles.push({ entry: { name: file.name, _blob: file, getFile: () => Promise.resolve(file) } });
                    }
                }
                // Source virtuelle pour le fallback
                const virtualSourceName = currentLang === 'fr' ? 'Fichiers sélectionnés' : 'Selected Files';
                // Ajouter une source fictive pour l'affichage
                if (!sources.find(s => s.name === virtualSourceName)) {
                    sources.push({ name: virtualSourceName, _virtual: true, _files: [] });
                }
                const vsrc = sources.find(s => s.name === virtualSourceName);
                vsrc._files = (vsrc._files || []).concat(newFiles);
                files.push(...newFiles);
                renderLibrary();
                renderSourcesUI();
                input.remove();
                if (newFiles.length > 0) {
                    const msg = currentLang === 'fr'
                        ? `${newFiles.length} fichier(s) ajouté(s) avec succès.`
                        : `${newFiles.length} file(s) added successfully.`;
                    // Feedback visuel subtil
                    const banner = document.createElement('div');
                    banner.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--neon-lime);color:#000;font-weight:bold;font-size:11px;padding:8px 20px;border-radius:6px;z-index:9999;letter-spacing:1px;';
                    banner.innerText = msg;
                    document.body.appendChild(banner);
                    setTimeout(() => banner.remove(), 2500);
                }
            };
            input.click();
        }

        async function removeSource(name) {
            if(!confirm(currentLang === 'fr' ? "Supprimer l'accès à ce dossier ?" : "Remove access to this folder?")) return;
            const src = sources.find(s => s.name === name);
            if (src && !src._virtual) {
                // Source réelle File System Access API
                const db = await openDB();
                db.transaction("sources", "readwrite").objectStore("sources").delete(name);
            }
            sources = sources.filter(s => s.name !== name);
            await refreshFiles();
        }

        async function refreshFiles() {
            files = [];
            // Activer le pré-cache contenu sur mobile (handles FileSystem Access stables pendant le scan)
            mobilePrecacheEnabled = shouldPrecacheOnMobile();
            if (mobilePrecacheEnabled) {
                console.log('[Partoches] Mode pré-cache mobile activé — lecture anticipée des fichiers');
            }
            for(const h of sources) {
                try {
                    if (h._virtual) {
                        // Source iOS fallback : fichiers déjà en mémoire
                        if (h._files) files.push(...h._files);
                    } else {
                        const results = await scanFolder(h);
                        files.push(...results);
                    }
                } catch(e) { console.warn("Dossier inaccessible", h.name, e); }
            }
            renderLibrary();
            renderSourcesUI();
        }

        async function scanFolder(handle) {
            // Déléguer au scanner avec cache pour permettre le re-scan sur NotFoundError
            return scanFolderWithCache(handle, null);
        }

        function renderSourcesUI() {
            const container = document.getElementById('source-list'); container.innerHTML = '';
            sources.forEach(s => {
                const tag = document.createElement('div'); tag.className = 'source-tag';
                tag.innerHTML = `${s.name} <span class="source-delete" onclick="removeSource('${s.name}')">✕</span>`;
                container.appendChild(tag);
            });
        }

        async function restoreAccess() {
            try {
                for(const h of sources) { 
                    if (!h._virtual) await h.requestPermission({ mode: 'read' }); 
                }
                document.getElementById('btn-restore').classList.add('hidden');
                refreshFiles();
            } catch(e) { 
                alert(currentLang === 'fr' ? "Permission refusée." : "Permission denied."); 
            }
        }

                 .sort((a,b) => a.entry.name.localeCompare(b.entry.name))

                    row.className = "file-row flex justify-between items-center p-3 px-4";

                                     <button onclick="handleSelectLibraryItem(this, '${file.entry.name.replace(/'/g, "\\'")}')" class="btn-jazz !py-1 transition-all duration-200">${i18n[currentLang].btn_add}</button>`;
                    l.appendChild(row);

            if (typeof refreshAlphaBarV10 === 'function') requestAnimationFrame(refreshAlphaBarV10);

            buttonEl.innerText = currentLang === 'fr' ? "Ajouté ✔" : "Added ✔";

        function generateAlphaBar() {

        function addToSet(name) {
            const div = document.createElement('div');
            div.className = "flex justify-between items-center bg-[#141419] p-3 mb-2 rounded border border-white/5 cursor-move";
            div.dataset.name = name;
            div.innerHTML = `<span class="text-[11px] text-zinc-300 font-bold truncate pr-3">${name}</span> 
                             <button onclick="this.parentElement.remove()" class="text-pink-500 font-bold px-2">✕</button>`;

        function saveCurrentSet() {
            const name = prompt(currentLang === 'fr' ? "Nom de la Setlist :" : "Setlist Name :");
            if (!name) return;
            const items = Array.from(document.getElementById('set-list-current').children).map(c => c.dataset.name);

        function clearCurrentSet() { if(confirm("Vider la liste actuelle ?")) document.getElementById('set-list-current').innerHTML = ''; }

        function renderSavedSets() {
            const list = document.getElementById('saved-sets-list'); list.innerHTML = '';
            Object.keys(localStorage).filter(k => k.startsWith('part_set_')).forEach(key => {
                const name = key.replace('part_set_', '');

        function deleteSet(key) { if(confirm("Supprimer ce set ?")) { localStorage.removeItem(key); renderSavedSets(); } }

        function loadSet(key) {
            const names = JSON.parse(localStorage.getItem(key));
            setFiles = []; document.getElementById('set-list-current').innerHTML = '';
            names.forEach(n => {
                const f = files.find(file => file.entry.name === n);
                if (f) { setFiles.push(f); addToSet(n); }
